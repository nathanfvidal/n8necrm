# CRM n8necrm -- FASE 1: so o desafio ACME, sem TLS.
#
# ESTE ARQUIVO E TEMPORARIO. Ele existe por causa de um ovo e uma galinha:
# `nginx -t` falha se um bloco de porta 443 apontar para um certificado que
# ainda nao existe, e o certificado nao pode ser emitido enquanto o nginx nao
# responder ao desafio HTTP-01 em crm.nateksoft.com.
#
# E o desafio nao seria respondido sozinho. Medido em 2026-08-21:
# /opt/nateksoft/nginx/nateksoft.conf tem um bloco `listen 80` com server_name
# curinga terminando em `return 404`, e o bloco ACME padrao da maquina e
# `listen 80 default_server` SEM server_name. Na precedencia do nginx o curinga
# ganha do default_server -- entao um `certbot certonly --webroot` para
# crm.nateksoft.com receberia aquele 404 e falharia.
#
# Este arquivo casa o nome EXATO, que ganha do curinga, e serve o desafio. A
# tarefa de publicacao o SUBSTITUI por crm.nateksoft.com.conf assim que o
# certificado existir.

server {
    listen 80;
    listen [::]:80;
    server_name crm.nateksoft.com;

    # O mesmo webroot que o resto da maquina ja usa.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 404 e nao 301: nao ha para onde redirecionar ainda, e um 301 para https
    # numa origem sem certificado daria erro de certificado no navegador em vez
    # de "ainda nao publicado".
    location / {
        return 404;
    }
}
