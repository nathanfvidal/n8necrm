# CRM n8necrm -- configuracao definitiva da borda.
#
# ## Por que este arquivo e SEPARADO de /opt/nateksoft/nginx/nateksoft.conf
#
# Aquele arquivo e o que mantem n8n e Evolution no ar. Este nao o toca em linha
# nenhuma. Na precedencia do nginx, `server_name` EXATO ganha de curinga a
# esquerda, independentemente da ordem dos arquivos -- entao os blocos curinga
# que hoje respondem por crm.nateksoft.com (404 na porta 80, e o certificado de
# outro servico na 443) sao superados sem serem editados.
#
# Reverter o CRM inteiro na borda e apagar um symlink:
#     rm /etc/nginx/sites-enabled/crm.nateksoft.com.conf
#     nginx -t && systemctl reload nginx
#
# ## O que este arquivo NAO faz, e por que
#
# Nenhum `add_header` de seguranca. next.config.ts ja envia nosniff (linha 21),
# X-Frame-Options (29), Referrer-Policy (37), Permissions-Policy (44) e HSTS
# (61); src/proxy.ts envia o CSP com nonce POR REQUISICAO. Um CSP aqui faria o
# navegador receber DOIS e aplicar a INTERSECAO das duas politicas -- mais
# restritiva que qualquer uma isolada, e quebrando de um jeito dificil de
# diagnosticar. O comentario no topo de next.config.ts ja registra esse modo de
# falha; tests/unit/deploy-nginx.test.ts o impede pela outra ponta.
#
# Nenhum `proxy_set_header Upgrade`/`Connection`. `next start` em producao nao
# usa WebSocket (o HMR e so de `next dev`). As duas linhas exigiriam um bloco
# `map` para nao mandar "upgrade" em toda requisicao, e nao compram nada.

upstream n8necrm {
    # A aplicacao tambem ESCUTA so no laco local (ver
    # deploy/systemd/n8necrm-web.service): a VPS nao tem ufw ativo, entao esse
    # bind e a unica coisa que impede alguem de falar com a aplicacao direto,
    # sem passar por aqui, mandando o X-Real-IP que quiser.
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name crm.nateksoft.com;

    # Continua servindo o desafio DEPOIS da emissao: e por aqui que
    # `certbot renew` renova a cada 60 dias. Tirar esta linha nao quebra nada na
    # hora -- faz o certificado expirar em silencio tres meses depois.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # `listen ... http2` e nao a diretiva `http2 on;`: o nginx desta VPS e
    # 1.24.0, e a diretiva so existe a partir da 1.25.1. Mesmo estilo dos
    # blocos de n8n e Evolution, que rodam nesta mesma instancia.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name crm.nateksoft.com;

    ssl_certificate /etc/letsencrypt/live/crm.nateksoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/crm.nateksoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # 10M e nao os 50M dos outros dois blocos desta maquina: o CRM nao recebe
    # upload de midia. A Evolution recebe, e por isso ela tem 50M.
    client_max_body_size 10M;

    # ------------------------------------------------------------------
    # A rota de tick da fila NAO e servida para fora.
    #
    # Na Vercel esta rota era air-gapped da internet pela plataforma, e o SDK
    # daquela fila nao verificava assinatura nenhuma -- confiava inteiramente
    # naquela garantia de rede. Fora da Vercel a garantia sumiu, e
    # WHATSAPP_QUEUE_SECRET virou a UNICA defesa de uma rota alcancavel por
    # qualquer um (o bloco daquela variavel em .env.example diz isso em voz
    # alta).
    #
    # O gatilho escolhido e o worker EM PROCESSO (`npm run fila:worker`), que
    # chama drenarFila() direto e nao usa esta rota nem este segredo. Entao nada
    # legitimo a chama de fora, e recusa-la aqui devolve a segunda camada que a
    # saida da Vercel custou.
    #
    # 404, e nao 403: a propria rota responde 404 a segredo errado
    # (src/app/api/queues/whatsapp-turn/route.ts:73), pelo motivo escrito la --
    # nao confirmar a quem esta adivinhando que o path existe. Um 403 aqui
    # distinguiria "bloqueado na borda" de "segredo errado", e essa diferenca e
    # a confirmacao que o 404 recusa dar.
    #
    # SE UM DIA O GATILHO VOLTAR A SER UM AGENDADOR EXTERNO, este bloco tem de
    # sair -- e ai o segredo volta a ser a unica defesa, conscientemente.
    # ------------------------------------------------------------------
    location = /api/queues/whatsapp-turn {
        return 404;
    }

    location / {
        proxy_pass http://n8necrm;
        proxy_http_version 1.1;

        # Host: o Auth.js monta callback a partir dele. AUTH_URL no arquivo de
        # ambiente e a fonte autoritativa; isto mantem as duas de acordo.
        proxy_set_header Host $host;

        # A LINHA QUE SUSTENTA IP_CABECALHO_CONFIAVEL="x-real-ip".
        # `$remote_addr` SOBRESCREVE: o que o cliente mandou neste cabecalho e
        # descartado aqui. E o oposto exato da linha de baixo, e essa diferenca
        # e o motivo de a variavel apontar para este cabecalho e nao para
        # aquele.
        proxy_set_header X-Real-IP $remote_addr;

        # `$proxy_add_x_forwarded_for` ACUMULA: vira "<o que o cliente mandou>,
        # <ip do socket>". Correto para a convencao do cabecalho, e
        # INUTILIZAVEL como fonte de IP confiavel, porque src/lib/ip.ts:100 le o
        # PRIMEIRO item da lista -- que e o do cliente.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Sem isto o Next monta URL http:// atras do proxy e o cookie de sessao
        # `__Secure-` nao e aceito -- login que parece funcionar e nao mantem
        # sessao.
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming do App Router: com buffering ligado o nginx segura a
        # resposta ate o fim e a renderizacao progressiva do React some.
        proxy_buffering off;

        # 90s cobre a exportacao de leads, a rota mais lenta que sobra depois de
        # a de tick ser recusada acima. O padrao do nginx e 60s.
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }
}
